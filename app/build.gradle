apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'

android {
    compileSdk 34
    namespace "com.baoge.wnotes"
    defaultConfig {
        applicationId "com.baoge.wnotes"
        minSdkVersion 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
    buildFeatures {
        viewBinding true
    }
    greendao {
        schemaVersion 20
        daoPackage "com.baoge.wnotes.dao"
        targetGenDir "src/main/java"
    }

//    applicationVariants.all { variant ->
//        variant.outputs.all {
//            //project.name
//            outputFileName =  "WNote.apk"
//        }
//    }


    signingConfigs {

        release {
            storeFile file('../key/key.jks') // 指定密钥库文件路径
            storePassword '111111111' // 密钥库密码
            keyAlias 'zdjkey' // 密钥别称
            keyPassword '111111111' // 密钥密码
        }


    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\""
            applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    outputFileName = "WNote.apk"
                }
            }
        }

        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\""
            applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    outputFileName = "WNote.apk"
                }
            }


        }
    }



}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.annotation:annotation:1.0.2'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
    testImplementation 'junit:junit:4.12'
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.0'
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'
    implementation 'com.alibaba:fastjson:1.2.28'
    // implementation 'com.afollestad.material-dialogs:input:0.9.6.0'
//    implementation 'com.afollestad.materal-dialogs:datetime:0.9.6.0'
//    implementation 'com.afollestad.material-dialogs:bottomsheets:0.9.6.0'
//    implementation 'com.afollestad.material-dialogs:lifecycle:0.9.6.0'
//    implementation 'com.afollestad.material-dialogs:color:0.9.6.0'
//    implementation 'com.afollestad.material-dialogs:files:0.9.6.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
}
